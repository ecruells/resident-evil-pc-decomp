; config.ini - Resident Evil 1 PC Decomp Configuration
; This file overrides registry settings for development/debugging

[Display]
; 0 = windowed, 1 = fullscreen
FullScreen=0
; Resolution width
Width=640
; Resolution height
Height=480
; Bits per pixel (16 or 32)
BitDepth=32
; Refresh rate (0 = default)
RefreshRate=0

[Debug]
; 1 = show FPS counter, 0 = hide
ShowFPS=1
; 0 = Windows, 1 = Direct3D debug layer
D3DDebug=1
; Skip intro videos (1 = skip)
SkipVideos=0
; Initial state of the collision boundary overlay; F5 toggles it in game.
; Green/cyan/yellow = the records as stored (rect / circle / soft zone),
; red = the same grown by the player's radius + 18 (where his centre stops),
; blue = the player's collision circle. Every record in the room is drawn, but
; only the player's own quadrant is live at runtime - check_room_collision tests
; that list alone.
ShowCollision=0
; World Y of the plane the overlay is drawn on. 0 = the room floor (-Y is up),
; which is what lines up with the pre-rendered background.
CollisionY=0
