; config.ini - Resident Evil 1 PC Decomp Configuration
; This file overrides registry settings for development/debugging

[Display]
; 0 = windowed, 1 = fullscreen
FullScreen=0
; Resolution width
Width=1024
; Resolution height
Height=768
; Bits per pixel (16 or 32)
BitDepth=32
; Refresh rate (0 = default)
RefreshRate=0
; Wait for vblank on present. 0 = off (default, and what the original did in a
; window): the engine paces itself to 33 ms per tick in software. Turning this
; on hands the tick rate to the display and makes the game run off-speed.
VSync=0

[Assets]
; Asset version to run. Controls which data root every asset path is built
; against. The path templates are identical across versions; only the root
; folder name differs (USA -> .\assets\USA\ , JPN -> .\assets\JPN\ in debug;
; .\usa\ / .\jpn\ in release).
; USA = North American / GOG asset tree (default)
; JPN = Japanese PC (Biohazard) asset tree
Version=USA

[Debug]
; Master switch for the port-added debug features: F1 debug menu (room
; change, inventory/flag editors, quick access save/load/itembox), F6 texture
; viewer, F8 collision overlay toggle.
; 0 (or missing) = disabled; 1 = enabled. Debug builds default to 1.
EnableDebug=0
