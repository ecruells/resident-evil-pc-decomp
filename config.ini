; config.ini - Resident Evil 1 PC Decomp Configuration
; This file overrides registry settings for development/debugging

[Display]
; 0 = windowed, 1 = fullscreen
FullScreen=0
; Resolution width
Width=640
; Resolution height
Height=480
; Bits per pixel (16 or 32)
BitDepth=32
; Refresh rate (0 = default)
RefreshRate=0

[Debug]
; 1 = show FPS counter, 0 = hide
ShowFPS=1
; 0 = Windows, 1 = Direct3D debug layer
D3DDebug=1
; Skip intro videos (1 = skip)
SkipVideos=0
